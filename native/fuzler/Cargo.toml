[package]
name = "fuzler"
version = "0.1.3"
authors = ["Yuriy Zhar"]
edition = "2021"
rust-version = "1.82"
description = "Rust NIF backing the Fuzler Elixir package"
license = "MIT"
repository = "https://github.com/elchemista/fuzler"

[lib]
name = "fuzler"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustler = "0.36.2"
triple_accel = "0.4.0"
smallvec = "1.13"
rustc-hash = "1.1"
tracing = "0.1.41"
unicode-normalization = "0.1.25"
unicode-segmentation = "=1.12.0"

[dev-dependencies]
proptest = "=1.8.0"
# Proptest accepts newer Tempfile releases whose Edition 2024 manifest cannot
# be parsed by the project's Rust 1.82 minimum toolchain.
tempfile = "=3.20.0"

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"
