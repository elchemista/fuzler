name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  RUSTLER_PRECOMPILATION_EXAMPLE_BUILD: "1"

jobs:
  elixir:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.20.2"
            otp: "29.0.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: mix deps.get

      - name: Reject unused dependencies
        run: mix deps.unlock --check-unused

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Run tests and enforce coverage
        run: mix test --force --cover

      - name: Run Credo
        if: matrix.elixir == '1.20.2'
        run: mix credo --strict

      - name: Run Dialyzer
        if: matrix.elixir == '1.20.2'
        run: mix dialyzer

      - name: Audit Hex dependencies
        if: matrix.elixir == '1.20.2'
        run: mix hex.audit

      - name: Verify HexDocs
        if: matrix.elixir == '1.20.2'
        run: mix docs --warnings-as-errors

      - name: Verify Hex package contents
        if: matrix.elixir == '1.20.2'
        run: mix hex.build

      - name: Check performance budgets
        if: matrix.elixir == '1.20.2'
        run: mix run bench/regression_check.exs

      - name: Smoke-test the packaged library
        if: matrix.elixir == '1.20.2'
        run: bash scripts/package_smoke.sh

  rust:
    name: Rust
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path native/fuzler/Cargo.toml --check

      - name: Run tests
        run: cargo test --manifest-path native/fuzler/Cargo.toml --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --manifest-path native/fuzler/Cargo.toml --locked --all-targets --all-features -- -D warnings

  minimum_rust:
    name: Minimum Rust 1.82
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up minimum supported Rust
        uses: dtolnay/rust-toolchain@1.82.0

      - name: Run native tests
        run: cargo test --manifest-path native/fuzler/Cargo.toml --locked --all-targets
